<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Гедонизм — лонгрид</title>
  <meta name="description" content="Лонгрид-манифест о том, что естественные желания давно удовлетворены, а остальные нам навязали.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..800&family=Inter:wght@400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 00 — Hero -->
  <section class="hero" id="hero" aria-labelledby="hero-title">
    <img class="hero__bg" src="images/hero-hands.png" alt="" width="1440" height="900">
    <div class="hero__content">
      <h1 class="hero__title" id="hero-title">Гедонизм</h1>
      <a class="hero__read" href="#want">Читать ↓</a>
    </div>
  </section>

  <!-- 01 — Ты хочешь всё -->
  <section class="block want" id="want" aria-labelledby="want-title">
    <div class="stage">
      <img class="want__img want__img--negroni" src="images/want-negroni.png" alt="Бутылка негрони на красном столе на фоне зелёного бархата" width="414" height="466" loading="lazy">
      <img class="want__img want__img--hands" src="images/want-hands.png" alt="Сплетённые руки, чёрно-белое фото" width="414" height="619" loading="lazy">
      <img class="want__img want__img--tire" src="images/want-tire.png" alt="Гоночная шина с монограммным узором" width="414" height="402" loading="lazy">

      <h2 class="headline want__title" id="want-title">
        <span class="headline__line">Ты хочешь</span>
        <span class="headline__mark headline__mark--pink">всё_</span>
      </h2>

      <figure class="quote want__quote">
        <blockquote>Еды, секса, отдыха. Потом — всего остального. «Желание есть самая сущность человека».</blockquote>
        <figcaption>— Спиноза, «Этика»</figcaption>
      </figure>
    </div>
  </section>

  <!-- 02 — Мерка Эпикура -->
  <section class="block measure" id="measure" aria-labelledby="measure-title">
    <div class="stage">
      <h2 class="measure__label" id="measure-title">Потребности</h2>

      <ul class="measure__scale">
        <li class="measure__bar measure__bar--needed">Необходимые</li>
        <li class="measure__bar measure__bar--natural">Естественные</li>
        <li class="measure__bar measure__bar--empty"><span>Пустые</span></li>
      </ul>

      <p class="measure__text">Еда, вода, сон, безопасность, дружба — давно закрыто. Почти всё, чего мы хотим сегодня, — из внешнего круга: богатство, слава, статус. У них нет точки насыщения.</p>

      <figure class="quote quote--mono measure__quote">
        <blockquote>«Кому мало того, что достаточно, тому ничего не достаточно».</blockquote>
        <figcaption>— Эпикур</figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
